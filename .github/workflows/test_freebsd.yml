name: Test FreeBSD

on: [push, pull_request]

jobs:
  test:
    name: Test on FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Git
        run: |
          # See actions/checkout#135
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          cache-after-prepare: true
          prepare: |
            pkg install -y go pkgconf mesa-libs alsa-lib xorg-vfbserver \
              libX11 libXcursor libXext libXi libXinerama libXrandr libXrender
          run: |
            set -e
            go version

            # Xvfb's output must not stay on the session's stdout, or the ssh
            # command never returns and the job hangs until it times out.
            export DISPLAY=:99.0
            Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
            sleep 3

            # go vet
            # FreeBSD compiles the same *_linbsd.go sources as Linux, so the
            # Linux block list applies here too.
            # DIAGNOSTIC: does the block list actually filter here?
            ls -l .github/workflows/govetblock_linux.txt
            od -c .github/workflows/govetblock_linux.txt | head -5
            go list ./... ./skills/run-ebitengine-app-headless/_driver > /tmp/pkgs.txt
            echo "all packages: $(wc -l < /tmp/pkgs.txt)"
            grep -n "internal/glfw$\|internal/ui$" /tmp/pkgs.txt || true
            grep -v -x -F -f .github/workflows/govetblock_linux.txt /tmp/pkgs.txt > /tmp/pkgs_vet.txt || true
            echo "after block list: $(wc -l < /tmp/pkgs_vet.txt)"
            echo "still present after filter:"
            grep -n "internal/glfw$\|internal/ui$" /tmp/pkgs_vet.txt || echo "  (none - filter works)"
            xargs go vet < /tmp/pkgs_vet.txt
            go install ./internal/vettools
            go vet -vettool=$(which vettools) -v ./... ./skills/run-ebitengine-app-headless/_driver

            # go build
            go build -v ./... ./skills/run-ebitengine-app-headless/_driver
            # Compile without optimization to check potential stack overflow.
            # The option '-gcflags=all=-N -l' is often used at Visual Studio Code.
            # See also https://go.googlesource.com/vscode-go/+/HEAD/docs/debugging.md#launch and the issue #2120.
            go build "-gcflags=all=-N -l" -v ./...
            env GOOS=darwin GOARCH=amd64 go build -v ./...
            env GOOS=darwin GOARCH=arm64 go build -v ./...
            env GOOS=freebsd GOARCH=arm64 go build "-gcflags=github.com/ebitengine/purego/internal/fakecgo=-std" -v ./...
            env GOOS=js GOARCH=wasm go build -v ./...
            env GOOS=linux GOARCH=386 go build -v ./...
            env GOOS=linux GOARCH=amd64 go build -v ./...
            env GOOS=linux GOARCH=arm go build -v ./...
            env GOOS=linux GOARCH=arm64 go build -v ./...
            env GOOS=netbsd GOARCH=amd64 go build -v ./...
            env GOOS=netbsd GOARCH=arm64 go build -v ./...
            env GOOS=windows GOARCH=386 go build -v ./...
            env GOOS=windows GOARCH=amd64 go build -v ./...
            env GOOS=windows GOARCH=arm64 go build -v ./...

            # go test
            go test -shuffle=on -v -p=1 ./...
